[package]
name = "hxbridge-usb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Long-lived TonePush USB session serving ToneRelay JSON ops"

[[bin]]
name = "hxbridge-usb"
path = "src/main.rs"

[dependencies]
hx-proto = { path = "../../vendor/tonepush/crates/hx-proto" }
hx-usb = { path = "../../vendor/tonepush/crates/hx-usb" }
hx-catalog = { path = "../../vendor/tonepush/crates/hx-catalog" }
serde_json = "1"
ctrlc = { version = "3.4", features = ["termination"] }
