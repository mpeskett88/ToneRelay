[package]
name = "hxbridge-usb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Long-lived TonePush USB session serving ToneRelay JSON ops"

[lib]
name = "hxbridge_usb"
path = "src/lib.rs"

[[bin]]
name = "hxbridge-usb"
path = "src/main.rs"
required-features = ["daemon", "nusb"]

[features]
default = ["nusb", "daemon"]
nusb = ["hx-usb/nusb"]
daemon = ["dep:ctrlc"]

[dependencies]
hx-proto = { path = "../../vendor/tonepush/crates/hx-proto" }
hx-usb = { path = "../../vendor/tonepush/crates/hx-usb", default-features = false }
hx-catalog = { path = "../../vendor/tonepush/crates/hx-catalog" }
serde_json = "1"
ctrlc = { version = "3.4", features = ["termination"], optional = true }
