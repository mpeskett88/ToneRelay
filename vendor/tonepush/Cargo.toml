[workspace]
resolver = "2"
members = [
    "crates/hx-proto",
    "crates/hx-usb",
    "crates/hx-catalog",
]

[workspace.package]
version = "0.5.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/crmne/tonepush"
rust-version = "1.87"

[workspace.dependencies]
hx-proto = { path = "crates/hx-proto", version = "0.5.3" }
hx-usb = { path = "crates/hx-usb", version = "0.5.3" }
hx-catalog = { path = "crates/hx-catalog", version = "0.5.3" }
nusb = "0.2"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
