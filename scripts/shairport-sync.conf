// AirPlay receiver that plays into Helix USB 1/2.
// Installed to /etc/shairport-sync.conf by scripts/install-airplay.sh.

general = {
    name = "ToneRelay";
    output_backend = "alsa";
    interpolation = "soxr";
    // The ALSA rate converters are 16-bit, so inter-sample peaks on loud
    // masters clip when resampled to 48 kHz. -4 dB of headroom removes it.
    volume_max_db = -4.0;
};

sessioncontrol = {
    allow_session_interruption = "yes";
    session_timeout = 20;
};

alsa = {
    // AirPlay is 44.1 kHz; the helix_stereo PCM resamples to 48 kHz.
    output_device = "helix_stereo";
    // Multiples of 147 frames keep the 44.1 -> 48 kHz ratio exact (see asound-helix.conf).
    period_size = 1176;
    buffer_size = 14112;
};
