# Stereo playback into Helix USB 1/2.
# The Helix only accepts 8-channel S32_LE at 48 kHz (interface 2, altset 1).
# Installed to /etc/asound.conf by scripts/install.sh.
#
# The rate plugin converts one period at a time, so its real ratio is
# slave period / client period. 44100:48000 is exactly 147:160. dmix refuses
# any other slave period than 1280 frames, which forces the client period to
# 1176. Without that lock, a player that picks its own period (BlueALSA does)
# makes the ratio wrong by thousands of ppm and the stream crackles.

pcm.helix_dmix {
    type dmix
    ipc_key 2048
    slave {
        pcm "hw:HELIX,0"
        channels 8
        period_size 1280
        buffer_size 15360
    }
    bindings.0 0
    bindings.1 1
}

pcm.helix_stereo {
    type plug
    slave.pcm "helix_dmix"
    rate_converter "speexrate_medium"
    hint.description "Helix USB 1/2 (stereo)"
}

# Bluetooth has no volume ceiling of its own. 0.631 is -4 dB, the headroom
# the 16-bit resampler needs so loud masters do not clip.
pcm.helix_bt {
    type route
    slave.pcm "helix_stereo"
    ttable.0.0 0.631
    ttable.1.1 0.631
    hint.description "Helix USB 1/2 from Bluetooth"
}
